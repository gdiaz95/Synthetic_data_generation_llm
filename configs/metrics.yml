# Identifiers used for report naming and path templating.
dataset_name: adult_with_three
model: gemini-3.1-flash-lite-preview

# Real/original dataset path.
real_data_path: data/raw/adult_with_three.csv

# Synthetic dataset path.
synthetic_data_path: data/processed/adults_synthetic_three_gemini-3.1-flash-lite-preview.csv

# Output report path for structured-column metrics.
report_output_path: reports/{dataset_name}_{model}_structured_metrics.json

# Free-text columns to exclude from metrics for now.
# If .metadata/{dataset_name}/metadata.json exists, it overrides this list.
free_text_columns: []

# Optional metadata path template. Defaults to .metadata/{dataset_name}/metadata.json
metadata_json_path: .metadata/{dataset_name}/metadata.json

# Holdout split parameters for real data.
holdout_fraction: 0.2
random_state: 42

# Free-text distribution metric settings (applied per configured free-text column).
# FID/FBD is computed whole-to-whole over global mean/covariance in one embedding space.
# Calibration is reported against real-train vs real-holdout in the same embedding run.
# MMD is computed exactly in batches to avoid allocating full pairwise distance tensors.
text_embedding_dim: 768
text_max_features: 200000
text_mmd_batch_size: 4096

# Optional LLM-as-a-judge metrics.
# When enabled, the pipeline classifies balanced real-holdout vs synthetic examples
# for each free-text column and for full rows, then stores the resulting accuracy
# statistics in the report JSON.
llm_judge:
  enabled: false
  # model/provider default to configs/llm_generation.yml when omitted.
  max_examples_per_class: 128
  batch_size: 8
  random_state: 42
